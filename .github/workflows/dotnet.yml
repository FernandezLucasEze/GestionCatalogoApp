name: .NET CI/CD Pipeline

on:
  push:
    branches: [ "develop" ]
  pull_request:
    branches: [ "develop" ]

jobs:
  build: # El trabajo de CI que ya teníamos
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3
    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: 8.0.x # Verificamos que sea .NET 8
    
    - name: Restore dependencies
      run: dotnet restore
    
    - name: Build
      run: dotnet build --no-restore
    
    - name: Test
      run: dotnet test --no-build --verbosity normal
      
    # --- NOVEDAD: PUBLICAR LOS ARTEFACTOS ---
    # Este paso empaqueta la API compilada en una carpeta 'api-app'.
    - name: Publish API
      run: dotnet publish src/Presentation/GestionCatalogo.Api/GestionCatalogo.Api.csproj -c Release -o ${{env.DOTNET_ROOT}}/api-app

    # --- NOVEDAD: SUBIR LOS ARTEFACTOS DE LA API ---
    # Sube la carpeta 'api-app' para que el trabajo 'deploy' pueda usarla.
    - name: Upload API artifact
      uses: actions/upload-artifact@v3
      with:
        name: api-app
        path: ${{env.DOTNET_ROOT}}/api-app

  deploy: # <-- ¡TRABAJO PARA EL DESPLIEGUE (CD)!
    runs-on: ubuntu-latest
    needs: build # Se ejecuta solo si 'build' fue exitoso.
    environment:
      name: 'Production'
      url: ${{ steps.deploy-to-webapp.outputs.webapp-url }}
    
    steps:
    # --- NOVEDAD: DESCARGAR LOS ARTEFACTOS DE LA API ---
    - name: Download API artifact
      uses: actions/download-artifact@v3
      with:
        name: api-app

    # --- NOVEDAD: INICIAR SESIÓN EN AZURE ---
    - name: Log in to Azure
      uses: azure/login@v1
      with:
        creds: ${{ secrets.AZURE_CREDENTIALS }} # Usa el secreto JSON que creamos

    # --- NOVEDAD: DESPLEGAR EN AZURE WEB APP ---
    - name: Deploy to Azure Web App
      id: deploy-to-webapp
      uses: azure/webapps-deploy@v2
      with:
        app-name: 'gestion-catalogo-api-fernandezlucas'
        package: . # Despliega el contenido de la carpeta actual (el artefacto descargado)